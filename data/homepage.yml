showcase:
  enable: true
  subtitle: "REMnux: A Linux Toolkit for Malware Analysis"
  description: "REMnux&reg; is a Linux toolkit for reverse-engineering and analyzing malicious software. REMnux provides a curated collection of free tools created by the community. Analysts can use it to investigate malware hands-on or by directing AI agents, without having to find, install, and configure the tools. The REMnux MCP server provides those agents with guidance on which tools to run and how to interpret the results."
  image:
    alt: "REMnux keyboard and mouse image"
    x: "img/showcase.png"
    _2x: "img/showcase@2x.png"
  imageMobile:
    alt: "REMnux keyboard and mouse image"
